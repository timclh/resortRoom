<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <!-- Primary Meta Tags -->
  <title>Beach Resort | Luxury Rooms & Vacation Rentals</title>
  <meta name="title" content="Beach Resort | Luxury Rooms & Vacation Rentals" />
  <meta name="description" content="Experience luxury beachfront accommodation at Beach Resort. Choose from single, double, family, and presidential rooms." />
  <meta name="author" content="Beach Resort" />

  <!--
    __SITE_URL__ is replaced with the deployed site's origin by
    scripts/postbuild.js (it reads Netlify's URL variable). Social crawlers need
    absolute URLs for og:image.
  -->

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Beach Resort" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:title" content="Beach Resort | Luxury Rooms & Vacation Rentals" />
  <meta property="og:description" content="Experience luxury beachfront accommodation. Choose from single, double, family, or presidential rooms." />
  <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Beach Resort | Luxury Rooms & Vacation Rentals" />
  <meta name="twitter:description" content="Experience luxury beachfront accommodation. Choose from single, double, family, or presidential rooms." />
  <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Structured data. Only facts the site actually states are included. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Hotel",
    "name": "Beach Resort",
    "description": "Single, double, family, and presidential rooms.",
    "url": "__SITE_URL__/",
    "image": "__SITE_URL__/og-image.jpg",
    "priceRange": "$100 - $600"
  }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!--
    Static copy of the contact form. Netlify only discovers forms in the built
    HTML, and the real form is rendered by React, so this declares it. The field
    names must match src/pages/Contact.js.
  -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <input name="subject" />
    <textarea name="message"></textarea>
  </form>

  <div id="root"></div>
</body>

</html>
